name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # permet aussi de lancer le workflow manuellement depuis l'onglet Actions

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Universal (Intel + Apple Silicon en un seul binaire)
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'

          # Linux (le plus proche d'un "universal" reste l'AppImage,
          # qui embarque ses dépendances)
          - platform: 'ubuntu-22.04'
            args: ''

          # Windows x64
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Installer les dépendances système (Linux uniquement)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Installer Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          # Cibles nécessaires pour le build universel macOS
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache des dépendances Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Installer les dépendances front-end
        run: npm ci

      - name: Build & bundle Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Décommentez et configurez ces lignes si vous activez la
          # signature/mise à jour automatique (updater Tauri) :
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'idc-launcher v__VERSION__'
          releaseBody: 'Voir les fichiers ci-dessous pour télécharger cette version.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
