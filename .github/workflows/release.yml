name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # permet aussi de lancer le workflow manuellement depuis l'onglet Actions

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Universal (Intel + Apple Silicon) -> .dmg uniquement
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin --bundles dmg'
            uploadPlainBinary: false

          # Linux -> AppImage uniquement (fichier portable unique)
          - platform: 'ubuntu-22.04'
            args: '--bundles appimage'
            uploadPlainBinary: false

          # Windows -> pas d'installeur (le bundler NSIS a un bug amont),
          # on livre directement l'exécutable .exe brut
          - platform: 'windows-latest'
            args: '--no-bundle'
            uploadPlainBinary: true

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Installer les dépendances système (Linux uniquement)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Installer Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          # Cibles nécessaires pour le build universel macOS
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache des dépendances Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Installer les dépendances front-end
        run: npm ci

      - name: Recréer src-tauri/.env à partir du secret GitHub
        shell: bash
        run: printf '%s\n' "${{ secrets.SRC_TAURI_ENV_FILE }}" > src-tauri/.env

      - name: Écrire la clé de signature dans un fichier
        # Passer la clé comme CHEMIN DE FICHIER plutôt que comme variable
        # d'env multi-lignes évite un bug de troncature côté build AppImage
        # sur Linux (le contenu passe par des sous-scripts bash internes qui
        # peuvent mal ré-exporter une valeur multi-lignes).
        #
        # Le `sed` retire toute ligne vide en tête de fichier : une clé
        # minisign/Tauri ne doit JAMAIS commencer par un saut de ligne, sinon
        # le décodeur base64 échoue dès le premier octet (symbole 10 =
        # line feed à l'offset 0). C'est ce qui provoquait l'échec du build
        # Linux uniquement — le sous-script de bundling AppImage est plus
        # strict que le chemin de signature macOS sur ce point.
        shell: bash
        run: |
          printf '%s' "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" \
            | sed '/./,$!d' > "${{ runner.temp }}/idc-launcher.key"

      - name: Build & bundle Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/idc-launcher.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'idc-launcher v__VERSION__'
          releaseBody: 'Voir les fichiers ci-dessous pour télécharger cette version.'
          # IMPORTANT : releaseDraft est maintenant à true volontairement.
          # La release est créée en brouillon (visible seulement par les
          # collaborateurs du repo) et n'est PAS publiée automatiquement.
          # Tant qu'elle n'est pas publiée manuellement sur GitHub, elle ne
          # correspondra à aucune release "latest", donc l'endpoint updater
          # (/releases/latest/download/latest.json) ne la verra pas non plus
          # — les joueurs ne recevront la mise à jour qu'après validation
          # manuelle de la release (bouton "Publish release" sur GitHub).
          releaseDraft: true
          prerelease: false
          uploadPlainBinary: ${{ matrix.uploadPlainBinary }}
          args: ${{ matrix.args }}